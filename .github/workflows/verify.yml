name: Foundation verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Portable verification in pinned Node container
        run: |
          mkdir -p artifacts/verify
          set -o pipefail
          docker compose -p agentic-crm-verify -f compose.verify.yaml run --rm --build --no-deps verify 2>&1 | tee artifacts/verify-container.log
      - name: Real MySQL kernel regression in isolated tmpfs project
        run: |
          set -o pipefail
          node scripts/integration.mjs 2>&1 | tee artifacts/integration.log
      - name: Clean verification project
        if: always()
        run: docker compose -p agentic-crm-verify -f compose.verify.yaml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-verification
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
