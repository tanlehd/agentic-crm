events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    location = /gateway-health { access_log off; return 200 'ok'; }
    location = /api/v1/admin/channels/facebook/callback {
      access_log off;
      error_log /dev/null;
      set $api http://api:3001;
      proxy_pass $api;
      proxy_set_header Host $http_host;
    }
    location /api/ {
      set $api http://api:3001;
      proxy_pass $api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /auth/ {
      access_log off;
      set $api http://api:3001;
      proxy_pass $api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /identity/ {
      access_log off;
      set $identity http://keycloak:8080;
      proxy_pass $identity;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 8080;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
