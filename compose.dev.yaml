services:
  api:
    image: agentic-crm-development:local
    build: {context: ., dockerfile: infra/docker/Dockerfile, target: development}
    command: [pnpm, dev:api]
    volumes:
      - ./services/core-baseline/src:/app/services/core-baseline/src:ro
  worker:
    image: agentic-crm-development:local
    command: [pnpm, dev:worker]
    volumes:
      - ./services/core-baseline/src:/app/services/core-baseline/src:ro
  web:
    image: agentic-crm-web-development:local
    build: {target: development}
    command: [pnpm, dev:web]
    volumes:
      - ./apps/web/app:/app/apps/web/app:ro
