# Must be invoked with -p agentic-crm-test. Volumes remain project-scoped.
services:
  gateway:
    ports: !override [127.0.0.1:18080:8080]
  test:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: test
    environment:
      APP_ENV: test
    command: [pnpm, test]
